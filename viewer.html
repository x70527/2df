<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>2df Reconstruction Viewer</title><style>body{margin:0;background:#101010;color:#eee;font-family:system-ui}main{max-width:900px;margin:auto;padding:12px}.stage{position:relative;width:100%;aspect-ratio:1;background:#000}.stage>*{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button,input{padding:10px;background:#333;color:#fff;border:0;border-radius:8px}small{color:#aaa}</style><main><h1>2df Reconstruction Viewer</h1><small>Renders only saved source-derived component traces. It does not generate replacement anatomy.</small><div class="stage" id="stage"><img id="ref" src="SI_86343F68-B918-496A-8BA4-D5D6AD2F492C.png"><canvas id="c"></canvas></div><div class="bar"><button id="load">Load JSON file</button><input id="file" type="file" accept="application/json" hidden><button id="toggle">Hide reference</button><button id="copy">Copy current data</button></div><small id="status">No trace loaded yet.</small></main><script>
const stage=document.querySelector('#stage'),c=document.querySelector('#c'),ctx=c.getContext('2d'),ref=document.querySelector('#ref'),file=document.querySelector('#file'),status=document.querySelector('#status');let data={components:{}},shown=true;
function resize(){let r=stage.getBoundingClientRect(),d=devicePixelRatio;c.width=r.width*d;c.height=r.height*d;draw()}new ResizeObserver(resize).observe(stage);
function draw(){let r=stage.getBoundingClientRect(),d=devicePixelRatio;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);for(const [name,t] of Object.entries(data.components||{})){let p=t.points||[];if(p.length<2)continue;ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q.x*r.width,q.y*r.height):ctx.moveTo(q.x*r.width,q.y*r.height));if(t.closed)ctx.closePath();ctx.fillStyle='rgba(0,180,255,.18)';ctx.strokeStyle='rgba(0,220,255,.95)';ctx.lineWidth=2;ctx.fill();ctx.stroke();}}
load.onclick=()=>file.click();file.onchange=async()=>{data=JSON.parse(await file.files[0].text());status.textContent='Loaded '+Object.keys(data.components||{}).length+' component traces.';draw()};
toggle.onclick=()=>{shown=!shown;ref.style.display=shown?'block':'none';toggle.textContent=shown?'Hide reference':'Show reference'};copy.onclick=async()=>{let s=JSON.stringify(data,null,2);try{await navigator.clipboard.writeText(s);status.textContent='Current trace data copied.'}catch{prompt('Copy:',s)}};resize();
</script>
